<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case study · ZeroLab</title>
  <meta name="description" content="ZeroLab case study" />
  <link rel="icon" type="image/svg+xml" href="asset/zerolab logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=DM+Mono:wght@400&family=DM+Sans:wght@500;600&family=Geist:wght@400&family=Inter:wght@400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="nav.css" />
  <link rel="stylesheet" href="transition.css" />
  <link rel="stylesheet" href="project.css" />

  <!-- Every hop between case studies — the next-project link, its countdown,
       or a related card — goes through hashchange -> location.reload() below.
       Browsers restore the PREVIOUS scroll position across a reload by
       default, so the freshly loaded project rendered already scrolled to
       the footer, which satisfied the countdown's own IntersectionObserver
       immediately and started counting down again before the reader ever
       saw the hero — a same-project-forever loop with no way out. Opting
       out of that restoration is what makes a reload behave like the fresh
       visit it is meant to be. Must run before anything scrolls, so it sits
       ahead of even the hero stash below. -->
  <script>
    try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
  </script>

  <!-- Paints the hero at FIRST PAINT rather than after a round trip.
       The image URL normally lives in content/<slug>.json, so the request
       cannot start until that fetch resolves — measured at 73ms against a first
       paint of 84ms, meaning this page opened on flat colour and the photograph
       the leaving panel was showing blinked back in a frame later.

       The home page stashes the hero here before navigating, so this runs
       before <body> is even parsed and the request starts with the document.
       A <style> rule rather than touching .hero directly: the element does not
       exist yet. render() sets the same image again from the CMS data, which is
       both the fallback (direct visit, private mode, cleared storage) and the
       correction if the stash is ever stale. -->
  <script>
    (function () {
      try {
        var slug = (location.hash || "").replace(/^#/, "").toLowerCase();
        if (!slug) return;
        var src = sessionStorage.getItem("zl:hero:" + slug);
        if (!src) return;
        var s = document.createElement("style");
        // --hero-img, not background-image: the backdrop is painted by
        // .hero::before so that scroll parallax can move it, and a rule for a
        // pseudo-element is exactly as good here as one for the element —
        // neither exists yet, both apply the moment it does.
        s.textContent =
          '.hero{--hero-img:url("' + encodeURI(src).replace(/"/g, "%22") + '")}';
        document.head.appendChild(s);
      } catch (e) {
        /* no storage — render() sets it after the fetch, as before */
      }
    })();
  </script>
</head>
<body class="case">
  <!-- Top bar sits over the hero, so it lives outside .hero-inner -->
  <!-- Rendered by nav.js. Inverted: this sits on the dark hero. -->
  <header class="case-top" data-zl-nav data-nav-active="works" data-nav-invert></header>

  <!-- Hero + sections are rendered from case-studies.js -->
  <section class="hero" id="hero">
    <div class="hero-inner wrap">
      <dl class="hero-meta" id="heroMeta"></dl>
      <!-- Deliberately empty. Any placeholder here is painted from first paint
           until the content fetch resolves — about a second of the literal word
           sitting on the hero before the real title replaces it. -->
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-intro" id="heroIntro"></p>
    </div>
  </section>

  <main id="sections"></main>

  <!-- ------------------------------------------------------------------ -->
  <!-- Template components below: identical on every case study, so they   -->
  <!-- are markup, not content. Next project is derived from config.js's   -->
  <!-- order — (current index + 1), wrapping to the first project.         -->
  <!-- ------------------------------------------------------------------ -->

  <!-- Next-project reveal + footer, one section (replaces the old related-
       cards grid and the contact form). Backdrop is the NEXT project's own
       thumbnail — this section is a preview of where "next" goes, not a
       repeat of the page you are already on. -->
  <section class="contact">
    <img class="contact-bg" id="contactBg" src="asset/contact-bg.png" alt="" draggable="false" />
    <div class="contact-inner">
      <div class="next-project" id="nextProject">
        <a class="next-link" id="nextLink" href="index.html">
          <span class="next-link-text">Go To Next Project</span>
          <span class="next-arrow" aria-hidden="true">→</span>
        </a>
        <h2 class="next-title" id="nextTitle"></h2>
        <!-- The countdown, as a bar rather than a sentence. Sits at zero from
             render and only fills once the footer is completely in view — see
             the observer below. -->
        <div class="next-progress" id="nextProgress"
             role="progressbar" aria-label="Opening next project">
          <span class="next-progress-fill" id="nextProgressFill"></span>
        </div>
      </div>

      <!-- Same component, footer placement. Also on a dark backdrop.
           id is the countdown's trigger: it only starts once THIS is
           completely on screen, not just the reveal above it. -->
      <footer class="contact-foot" id="caseFooter" data-zl-nav data-nav-layout="footer"
              data-nav-active="works" data-nav-invert></footer>
    </div>
  </section>

  <script src="nav.js"></script>
  <!-- Leaving panel, shared with the home page. Intercepts links back to
       index.html and carries the current project across so home restores it. -->
  <script src="transition.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="config.js"></script>
  <script src="case-studies.js"></script>
  <script>
    (function () {
      function slugOf(p) {
        return (p.slug || p.name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-");
      }

      // Fills the hero copy — title, meta columns, intro — into the static
      // markup. One place, called from two: the first-paint stash below (panel
      // arrival) and render() after the fetch (direct visit, or as the
      // correction if the stash was ever stale).
      function fillHero(title, meta, intro) {
        document.getElementById("heroTitle").textContent = title || "";
        var metaEl = document.getElementById("heroMeta");
        metaEl.textContent = "";
        (meta || []).forEach(function (col) {
          var wrap = document.createElement("div");
          wrap.className = "hero-meta-col";
          var dt = document.createElement("dt");
          dt.textContent = col.label;
          wrap.appendChild(dt);
          var vals = document.createElement("div");
          vals.className = "vals";
          (col.values || []).forEach(function (v) {
            var dd = document.createElement("dd");
            dd.textContent = v;
            vals.appendChild(dd);
          });
          wrap.appendChild(vals);
          metaEl.appendChild(wrap);
        });
        document.getElementById("heroIntro").textContent = intro || "";
      }

      // FIRST PAINT, panel arrival: the leaving panel rose this hero during the
      // navigation and stashed its copy. Paint it now — before the two content
      // fetches even start — so the text lands continuously with the panel
      // instead of vanishing until the fetch resolves and blinking back in. The
      // image is already handled the same way by the <head> script. reveal.js
      // reads window.__zlHeroPre at startup and shows this in place rather than
      // revealing it again; render() below skips the hero when it has run.
      try {
        var preSlug = (location.hash || "").replace(/^#/, "").toLowerCase();
        var preRaw = preSlug && sessionStorage.getItem("zl:herotext:" + preSlug);
        if (preRaw) {
          var pre = JSON.parse(preRaw);
          fillHero(pre.title, pre.meta, pre.intro);
          window.__zlHeroPre = true;
          sessionStorage.removeItem("zl:herotext:" + preSlug);
        }
      } catch (e) {
        /* no stash / private mode / bad JSON — render() fills it after the fetch */
      }

      // config.js fetches content/projects.json, so the list is not available
      // synchronously. Everything below waits for it.
      (window.PROJECTS_READY || Promise.resolve([])).then(start);

      function start(projects) {
      projects = projects || [];

      // Resolve the project from the hash (project.html#slug).
      var slug = (location.hash || "").replace(/^#/, "").toLowerCase();
      var idx = -1;
      for (var i = 0; i < projects.length; i++) {
        if (slugOf(projects[i]) === slug) { idx = i; break; }
      }
      if (idx < 0) idx = 0;
      var project = projects[idx];
      if (!project) return;
      // Content now lives in content/<slug>.json, so rendering waits on the
      // fetch. `study` is null when a project has no content file yet.
      window.CaseStudies.load(slugOf(project)).then(render);

      function render(study) {
      document.title = project.name + " · ZeroLab";

      // --- hero ---------------------------------------------------------
      var heroEl = document.getElementById("hero");

      // The hero backdrop is painted by .hero::before, which reads this
      // variable — the layer exists so scroll parallax can move it, which a
      // background-image could not be. The CMS image IS the composed hero
      // (gradient and all), so it fills the frame via `cover` in project.css
      // rather than being positioned by hand.
      function setHeroBg(src) {
        if (src) heroEl.style.setProperty("--hero-img", 'url("' + encodeURI(src) + '")');
      }

      // The image is set every time: it corrects a stale stash and is what a
      // direct visit relies on. The copy is only filled when the panel did not
      // already paint it at first paint — refilling would tear down the hero
      // reveal.js has already shown in place and make it flash.
      if (study && study.hero) {
        // pickHero (config.js) takes the crop that matches this viewport's
        // shape. Same call the home page makes, so the panel that just rose
        // this hero and the page settling under it are showing the identical
        // file — a mismatch here would swap the backdrop out from under a
        // finished transition.
        setHeroBg(window.pickHero(study.hero.imageMobile, study.hero.imageTablet, study.hero.image));
        if (!window.__zlHeroPre) {
          fillHero(project.name, study.hero.meta || [], study.hero.intro || "");
        }
      } else {
        // No case study written yet — fall back to the cover and config meta.
        setHeroBg(project.image);
        if (!window.__zlHeroPre) {
          var bits = [];
          if (project.year) bits.push(project.year);
          if (project.role) bits.push(project.role);
          var fbMeta = bits.length ? [{ label: "Project", values: bits }] : [];
          fillHero(project.name, fbMeta, project.subtitle || "");
        }
      }

      // --- sections -----------------------------------------------------
      var main = document.getElementById("sections");
      var sections = (study && study.sections) || [];

      sections.forEach(function (s) {
        var sec = document.createElement("section");
        sec.className = "sec";
        sec.dataset.theme = s.theme || "light";
        sec.dataset.align = s.align || "left";
        sec.dataset.head = s.head || "row";

        var inner = document.createElement("div");
        inner.className = "wrap";

        var head = document.createElement("div");
        head.className = "sec-head";

        // Left column: the label chip on its own.
        var col1 = document.createElement("div");
        if (s.label) {
          var chip = document.createElement("p");
          chip.className = "sec-label";
          chip.textContent = s.label;
          col1.appendChild(chip);
        }
        head.appendChild(col1);

        // Right column: heading, with the body stacked beneath it.
        var col2 = document.createElement("div");
        col2.className = "sec-copy";
        var h2 = document.createElement("h2");
        h2.className = "sec-heading";
        h2.textContent = s.heading;
        col2.appendChild(h2);
        if (s.body && s.body.length) {
          var bodyEl = document.createElement("div");
          bodyEl.className = "sec-body";
          s.body.forEach(function (p) {
            var el = document.createElement("p");
            el.textContent = p;
            bodyEl.appendChild(el);
          });
          col2.appendChild(bodyEl);
        }
        head.appendChild(col2);
        inner.appendChild(head);

        var media = s.media || [];
        if (media.length) {
          var fig = document.createElement("div");
          fig.className = "sec-media";
          fig.dataset.count = String(Math.min(media.length, 3));
          fig.dataset.layout = s.mediaLayout || "even";
          media.forEach(function (src, i) {
            var frame = document.createElement("div");
            frame.className = "sec-media-frame";
            var img = document.createElement("img");
            img.src = src;
            img.alt = project.name + " — " + s.heading + " (" + (i + 1) + ")";
            img.loading = "lazy";
            img.draggable = false;
            frame.appendChild(img);
            fig.appendChild(frame);
          });
          inner.appendChild(fig);
        }

        sec.appendChild(inner);
        main.appendChild(sec);
      });

      // --- next project + its background -----------------------------------
      // The next project by order, wrapping past the end back to the first.
      // Single-project sites have nothing to point at — the section then
      // has no link and no countdown to start.
      var next = projects.length > 1 ? projects[(idx + 1) % projects.length] : null;

      var contactBg = document.getElementById("contactBg");
      var bgSrc = (next && (next.thumb || next.image)) || project.image;
      if (contactBg && bgSrc) contactBg.src = bgSrc;

      var nextSection = document.getElementById("nextProject");
      var nextLink = document.getElementById("nextLink");
      var nextTitle = document.getElementById("nextTitle");
      var nextProgressFill = document.getElementById("nextProgressFill");

      if (next) {
        var nextHref = "project.html#" + slugOf(next);
        nextLink.href = nextHref;
        nextTitle.textContent = next.name;

        // The bar is on screen from the start, empty — only the FILL waits for
        // the footer to be completely on screen, not just the reveal above it,
        // so nothing runs down until the reader has scrolled to the bottom.
        //
        // ONE constant drives both the bar and the navigation. Hand the CSS
        // the same number rather than writing 10s in two places, where they
        // could drift and the bar would sit full for a beat, or navigate with
        // travel still left in it.
        var COUNT_MS = 10000;
        var timer = null;
        nextProgressFill.style.setProperty("--countdown", COUNT_MS + "ms");

        function startCountdown() {
          nextProgressFill.style.scale = "1 1";
          timer = setTimeout(function () {
            // A real click, not a raw location change — so this rides the
            // exact same path a manual click does: the overlay router's
            // panel transition when browsing from home, or the plain
            // hashchange reload on a directly-loaded case page. Never two
            // different behaviours for the same navigation.
            nextLink.click();
          }, COUNT_MS);
        }

        var footerEl = document.getElementById("caseFooter");
        if ("IntersectionObserver" in window && footerEl) {
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                io.disconnect();
                startCountdown();
              }
            });
          }, { threshold: 1 });
          io.observe(footerEl);
        } else {
          // No IntersectionObserver support (or no footer to watch) — fall
          // back to starting at load rather than never counting down at all.
          startCountdown();
        }
      } else if (nextSection) {
        nextSection.style.display = "none";
      }

      // Hash changes (e.g. clicking the next-project link while already on
      // this page) re-render the page.
      window.addEventListener("hashchange", function () { location.reload(); });

      // The clock lives in nav.js now — it was showing the VIEWER's local time
      // here while the home page showed Jakarta, so the two disagreed outside
      // UTC+7. One ticker, one timezone.

      // Content is in the DOM — anything that has to measure it can bind now.
      window.dispatchEvent(new CustomEvent("casestudy:rendered"));
      } // end render
      } // end start
    })();
  </script>
  <!-- Smooth scroll and custom cursor. These bind to static markup, so load
       order relative to the async render above does not matter. -->
  <script src="case-interactions.js"></script>
  <!-- Scroll reveal. Measures rendered text, so it waits for the
       `casestudy:rendered` event dispatched above rather than for load. -->
  <script src="reveal.js"></script>
</body>
</html>
