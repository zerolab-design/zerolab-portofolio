# ============================================================================
#  Pages CMS config — app.pagescms.org
#
#  ONE FILE PER PROJECT. content/<slug>.json holds everything about a project:
#  its name and cover (used by the home page carousel) AND its case study page.
#  Editing a project means editing one entry — the home page and the detail
#  page read the same file, so they can never disagree.
#
#  content/projects.json is only the running order of those files.
#
#  The filename must match the slug, because project.html fetches
#  content/<slug>.json from the URL. Renaming a file breaks its page — use the
#  "Order" list to reorder projects instead.
# ============================================================================

media:
  input: portfolio
  output: portfolio

content:
  # --- running order --------------------------------------------------------
  - name: order
    label: Project order
    type: file
    path: content/projects.json
    format: json
    fields:
      - name: order
        label: Order
        type: string
        list: true
        description: >-
          Slugs in the order they appear on the home page. Each must match a
          file in content/ — "krool" means content/krool.json. Drag to reorder.

  # --- the projects themselves ----------------------------------------------
  - name: projects
    label: Projects
    type: collection
    path: content
    format: json
    filename: "{primary}.json"
    exclude: [projects.json]
    view:
      primary: name
      fields: [name, subtitle, year]
      sort: [name]
    fields:
      # --- identity — used by the home page carousel AND the detail page ----
      - name: name
        label: Name
        type: string
        description: The big title on the case study page, e.g. Krool. Also the carousel label.
      - name: subtitle
        label: Subtitle
        type: string
        description: Shown under the name, e.g. "CRM Dashboard".
      - name: year
        label: Year
        type: string
      - name: role
        label: Role
        type: string
        description: e.g. "Product Design". Shown on hover on the home page.
      - name: cover
        label: Cover
        type: image
        description: >-
          Full-size cover used by the carousel. Export 3:2 landscape at
          1600x1067 — this shape is fixed in the layout and is the same on every
          device, phones included. Serves tablet and desktop.
      - name: coverMobile
        label: Cover (phone)
        type: image
        description: >-
          Optional. Export 3:2 landscape at 900x600 — the SAME shape as the
          Cover, never upright. Used below 782px, where the strip draws it 77px
          across, so this is the version composed tighter: subject larger, fine
          detail dropped. Leave empty to use the Cover everywhere. A crop, not a
          smaller file — the site has no build step, so nothing resizes for you.
      - name: thumb
        label: Thumbnail
        type: image
        description: Small version for the film strip. Falls back to the cover.

      # --- hero -------------------------------------------------------------
      - name: hero
        label: Hero
        type: object
        fields:
          - name: intro
            label: Intro line
            type: text
            description: The sentence under the project title.
          - name: image
            label: Hero background
            type: image
            description: >-
              The WHOLE hero backdrop — export it 1440x929 from Figma with the
              gradient baked in and no text, since the page draws its own title
              on top. It fills the frame edge to edge.
          - name: imageMobile
            label: Hero background (phone)
            type: image
            description: >-
              Optional. The same backdrop re-composed UPRIGHT for phones held
              portrait below 782px. Export 1320x3160 (ratio 0.42). Unlike the
              cover, this really is a different shape — the hero box is the
              whole screen, so it turns with the device. Keep the focal content
              in the middle 80% vertically: the bottom 9% sits below the fold,
              and shorter phones crop top and bottom. A phone held SIDEWAYS uses
              the desktop hero, not this one.
          - name: imageTablet
            label: Hero background (tablet, portrait)
            type: image
            description: >-
              Optional. For tablets held portrait, 782px and up. Export
              1640x2600 (ratio 0.65) — between the phone crop and the desktop
              one. Tablets held LANDSCAPE use the desktop hero, which already
              suits their wide box. Leave empty and a portrait tablet falls back
              to the phone crop if there is one, then to the desktop image.
          - name: meta
            label: Meta columns
            type: object
            description: One column per entry — e.g. "Service" with three lines, "Year" with one.
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Column heading
                type: string
              - name: values
                label: Lines
                type: string
                list: true

      # --- contact / footer -------------------------------------------------
      - name: contact
        label: Contact section
        type: object
        fields:
          - name: background
            label: Background image
            type: image
            description: >-
              Sits behind the contact form, dimmed to 30%. Leave empty to reuse
              the hero background.

      # --- body -------------------------------------------------------------
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label} — {heading}"
        fields:
          - name: label
            label: Chip label
            type: string
            description: Small tag above the heading, e.g. "About Project" or "Features / 01".
          - name: heading
            label: Heading
            type: text
          - name: body
            label: Paragraphs
            type: text
            list: true
            description: One entry per paragraph. Leave empty for statement-only sections.
          - name: align
            label: Alignment
            type: select
            options:
              values: [left, justify]
            description: "left = heading with body beneath. justify = wide justified statement, usually no body."
          - name: head
            label: Chip position
            type: select
            options:
              values: [row, stack]
            description: "row = chip beside the heading. stack = chip directly above it."
          - name: theme
            label: Theme
            type: select
            options:
              values: [light, dark]
          - name: media
            label: Images
            type: image
            list: true
            description: "0–3 images. The count sets the layout: 1 = full width, 2 = pair, 3 = collage."
          - name: mediaLayout
            label: Image layout
            type: select
            options:
              values: [even, stagger, cascade]
            description: "even = cropped to a shared height. stagger = uneven, nothing cropped. cascade = 3 in one row, descending widths."

# ----------------------------------------------------------------------------
#  NOT EDITABLE HERE
#
#  Fixed in project.html because they are identical on every page: the nav
#  links, the "Read More Our Case Studies" heading, and the contact form labels.
#  A project's link (project.html#<slug>) is derived from its filename, so it
#  can never drift out of sync.
# ----------------------------------------------------------------------------
