<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About us · ZeroLab</title>
  <meta name="description" content="ZeroLab — a design studio. About us." />
  <link rel="icon" type="image/svg+xml" href="asset/zerolab logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* Placeholder page — replaced by the real About layout later. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #fff url("asset/background.png") center / cover no-repeat;
      font-family: "Plus Jakarta Sans", sans-serif;
      color: #000;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; }
    .brand { display: flex; align-items: center; text-decoration: none; color: #000; }
    /* asset/zerolab logo.svg is the FULL lockup (114x24) — mark and wordmark in
       one file. Height-only sizing keeps its aspect. Do not add a separate
       "ZeroLab" text node; the wordmark is already in the SVG. */
    .brand img { height: 24px; width: auto; display: block; }
    .back { font-size: 16px; letter-spacing: -0.16px; color: rgba(0, 0, 0, 0.6); text-decoration: none; }
    .back:hover { color: #000; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px 20px; text-align: center; }
    h1 { font-size: clamp(40px, 6vw, 64px); font-weight: 700; letter-spacing: -0.04em; text-transform: uppercase; line-height: 0.87; }
    p.tag { font-size: 15px; color: rgba(0, 0, 0, 0.5); max-width: 420px; line-height: 1.5; }
    .soon { display: inline-flex; padding: 2px 5px; background: #000; color: #fff; font-size: 14px; letter-spacing: -0.14px; line-height: 0.87; }
    a.mail { color: rgba(0, 0, 0, 0.6); font-size: 15px; text-decoration: underline; text-underline-position: from-font; }
    a.mail:hover { color: #000; }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">
      <img src="asset/zerolab logo.svg" alt="ZeroLab" draggable="false" />
    </a>
    <a class="back" href="index.html">← Back to works</a>
  </header>
  <main>
    <h1>About us</h1>
    <p class="tag">ZeroLab is a design studio crafting products, dashboards and mobile experiences.</p>
    <p class="soon">Full page — coming soon</p>
    <a class="mail" href="mailto:zerolab@gmail.com">zerolab@gmail.com</a>
  </main>
</body>
</html>
